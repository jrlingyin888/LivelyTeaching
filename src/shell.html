<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>小象课堂 LivelyTeaching</title>
<style>
:root{
  --navy:#14263f; --ink:#16202e; --line:#dfe6ee;
  --acc:#2e6f9e; --acc-d:#1f5479; --ok:#1f7a5a; --red:#d8453d;
  --panel:rgba(255,255,255,.94);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe3f0;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}

/* ---------- 顶栏 ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;
  gap:12px;padding:14px 20px;pointer-events:none}
.brand{background:var(--panel);backdrop-filter:blur(10px);border-radius:12px;
  padding:9px 16px;box-shadow:0 4px 18px rgba(20,38,63,.13);pointer-events:auto;
  display:flex;align-items:baseline;gap:10px}
.brand b{font-size:18px;color:var(--navy);letter-spacing:.01em}
.brand span{font-size:12.5px;color:#7b8898}
.dev{margin-left:auto;background:rgba(20,38,63,.75);color:#cfe0f0;font-size:11.5px;
  letter-spacing:.1em;padding:6px 11px;border-radius:8px;pointer-events:auto}

/* ---------- 数据面板 ---------- */
.hud{position:fixed;top:70px;right:20px;z-index:5;width:268px;background:var(--panel);
  backdrop-filter:blur(10px);border-radius:14px;padding:16px 18px;
  box-shadow:0 8px 30px rgba(20,38,63,.16)}
.hud h3{margin:0 0 12px;font-size:13px;letter-spacing:.08em;color:var(--acc);font-weight:650}
.row{display:flex;justify-content:space-between;align-items:baseline;
  padding:7px 0;border-top:1px solid #eef2f6;font-size:13.5px;color:#66727f}
.row:first-of-type{border-top:none}
.row .v{font-weight:700;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.row .v.ok{color:var(--ok)}
.track{height:9px;background:#e7edf3;border-radius:5px;overflow:hidden;margin:12px 0 4px}
#bar{height:100%;width:0;background:var(--acc);border-radius:5px;transition:width .35s ease}
#bar.done{background:var(--ok)}
.legend{display:flex;justify-content:space-between;font-size:11.5px;color:#98a4b2}

/* ---------- 步骤条 ---------- */
.steps{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:8px;background:var(--panel);backdrop-filter:blur(10px);
  padding:8px;border-radius:14px;box-shadow:0 6px 26px rgba(20,38,63,.15);max-width:94vw;overflow:auto}
.step{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;
  font-size:13.5px;color:#8996a5;white-space:nowrap}
.step i{width:19px;height:19px;border-radius:50%;background:#dfe6ee;color:#8996a5;
  font-size:11.5px;font-style:normal;display:grid;place-items:center;font-weight:700}
.step.active{background:var(--acc);color:#fff}
.step.active i{background:rgba(255,255,255,.28);color:#fff}
.step.done{color:var(--ok)}
.step.done i{background:var(--ok);color:#fff}

/* ---------- 操作条 ---------- */
.bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:94vw}
button.b{border:none;cursor:pointer;font:inherit;font-size:14.5px;font-weight:600;
  padding:12px 20px;border-radius:11px;background:var(--panel);color:var(--navy);
  backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(20,38,63,.14);transition:.15s}
button.b:hover{background:#fff;transform:translateY(-1px)}
button.b:active{transform:translateY(0)}
button.b.pri{background:var(--acc);color:#fff}
button.b.pri:hover{background:var(--acc-d)}
button.b.ghost{background:rgba(255,255,255,.68);color:#6d7987;font-weight:500}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:170px;left:50%;transform:translate(-50%,10px);z-index:6;
  background:rgba(20,38,63,.9);color:#fff;font-size:14px;padding:10px 20px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.3s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 结论 ---------- */
#result{position:fixed;inset:0;z-index:8;display:grid;place-items:center;
  background:rgba(12,24,40,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.35s}
#result.show{opacity:1;pointer-events:auto}
.card{background:#fff;border-radius:20px;padding:38px 44px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.3);max-width:min(520px,90vw);transform:scale(.94);transition:.35s}
#result.show .card{transform:scale(1)}
.card .t{font-size:13px;letter-spacing:.16em;color:var(--acc);font-weight:650;margin-bottom:10px}
.card h2{margin:0 0 6px;font-size:26px;color:var(--navy)}
.card .big{font-size:52px;font-weight:800;color:var(--navy);letter-spacing:-.02em;margin:14px 0 2px}
.card .big em{font-size:22px;font-style:normal;color:#8996a5;font-weight:600;margin-left:6px}
.card p{color:#66727f;font-size:15px;margin:14px 0 0;line-height:1.75}
.card .eq{display:flex;align-items:center;justify-content:center;gap:14px;
  margin:22px 0 4px;padding:16px;background:#f4f8fb;border-radius:13px}
.card .eq div{font-size:13px;color:#8996a5}
.card .eq b{display:block;font-size:19px;color:var(--navy);margin-top:3px}
.card .eq span{font-size:22px;color:var(--acc);font-weight:700}
.card button{margin-top:24px}

/* ---------- 启动层 ---------- */
#boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:linear-gradient(155deg,#152a49,#1f3f68 55%,#2a5f8d);transition:opacity .6s}
#boot.hide{opacity:0}
.bwrap{width:min(620px,90vw);color:#fff;text-align:center}
.bwrap .k{font-size:12.5px;letter-spacing:.24em;color:#8fb6d8;margin-bottom:14px}
.bwrap h1{font-size:34px;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
.bwrap .sub{color:#a9c7e2;font-size:15px;margin-bottom:34px}
#bootForm{display:flex;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:14px;padding:8px 8px 8px 18px;align-items:center}
#q{flex:1;background:none;border:none;outline:none;color:#fff;font:inherit;font-size:16.5px;min-width:0}
#q::placeholder{color:#8fb6d8}
#mic{width:42px;height:42px;border-radius:10px;border:none;cursor:pointer;flex:none;
  background:rgba(255,255,255,.14);color:#fff;font-size:18px;transition:.2s}
#mic:hover{background:rgba(255,255,255,.24)}
#mic.rec{background:var(--red);animation:pulse 1s infinite}
#mic.off{opacity:.35;cursor:not-allowed}
@keyframes pulse{50%{opacity:.6}}
#go{border:none;cursor:pointer;background:#fff;color:#1f3f68;font:inherit;font-weight:650;
  font-size:15px;padding:11px 22px;border-radius:10px;flex:none}
.chips{display:flex;gap:9px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#cfe2f2;
  font-size:13.5px;padding:7px 15px;border-radius:20px;cursor:pointer;transition:.2s}
.chip:hover{background:rgba(255,255,255,.22)}
#bootErr{color:#ffc9c4;font-size:13.5px;margin-top:16px;min-height:20px}
#bootHit{display:none;text-align:left}
.hitbox{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
  border-radius:14px;padding:18px 22px;margin-bottom:22px}
.hitbox .l{font-size:12px;letter-spacing:.14em;color:#8fb6d8;margin-bottom:6px}
.hitbox h2{margin:0 0 4px;font-size:22px}
.hitbox .m{color:#a9c7e2;font-size:13.5px}
.pstep{display:flex;align-items:center;gap:11px;padding:11px 4px;font-size:14px;
  color:#7f9fbe;border-top:1px solid rgba(255,255,255,.09)}
.pstep:first-child{border-top:none}
.pstep b{color:#cfe2f2;font-weight:600;min-width:118px}
.pstep span{font-size:13px}
.pstep .dot{width:9px;height:9px;border-radius:50%;background:#4d7ba6;flex:none;
  animation:blink .9s infinite}
.pstep.ok{color:#a9c7e2}
.pstep.ok .dot{background:#4ecfa0;animation:none}
.pstep.ok b{color:#fff}
@keyframes blink{50%{opacity:.25}}
.bnote{color:#7396b8;font-size:12.5px;margin-top:26px;line-height:1.7}

@media(max-width:820px){
  .hud{top:auto;bottom:172px;right:12px;left:12px;width:auto}
  .steps{bottom:88px} .bar{bottom:16px}
  .bwrap h1{font-size:26px}
}
</style></head>
<body>

<div id="stage"></div>

<div class="top">
  <div class="brand"><b id="bTitle">小象课堂</b><span id="bSub">LivelyTeaching</span></div>
  <div class="dev">开发版 DEV</div>
</div>

<div class="hud">
  <h3>实验数据</h3>
  <div id="stats"></div>
  <div class="track"><div id="bar"></div></div>
  <div class="legend"><span>空船</span><span id="legendR" class="v">—</span></div>
</div>

<div class="steps" id="steps"></div>
<div class="bar" id="actions"></div>
<div id="toast"></div>
<div id="result"><div class="card"></div></div>

<div id="boot"><div class="bwrap">
  <div id="bootForm_wrap">
    <div class="k">小象课堂 · LivelyTeaching</div>
    <h1>说一句话，课件就出现</h1>
    <div class="sub">告诉我你要讲的知识点，我来生成可交互的 3D 实验</div>
    <form id="bootForm" autocomplete="off">
      <input id="q" placeholder="例如：我要讲曹冲称象" />
      <button type="button" id="mic" title="语音输入">&#127908;</button>
      <button id="go" type="submit">生成课件</button>
    </form>
    <div class="chips"><span class="chip">曹冲称象</span></div>
    <div id="bootErr"></div>
  </div>
  <div id="bootHit">
    <div class="hitbox">
      <div class="l">已识别</div>
      <h2 id="hitName"></h2>
      <div class="m" id="hitTags"></div>
      <div class="m" style="margin-top:6px">需要生成的物体：<span id="hitObj"></span></div>
    </div>
    <div id="bootSteps"></div>
  </div>
  <div class="bnote">开发版：3D 模型为内置占位资产，接入即梦 + Tripo API 后由链路实时生成</div>
</div></div>

<script>
(function(){try{var c=document.createElement('canvas');
if(!(window.WebGLRenderingContext&&(c.getContext('webgl2')||c.getContext('webgl')))){
document.getElementById('boot').innerHTML='<div class="bwrap"><h1>当前浏览器无法运行 3D 课件</h1>'+
'<div class="sub">请使用 Chrome / Edge 最新版打开，并在浏览器设置中开启「使用硬件加速」。</div></div>';}}catch(e){}})();
</script>
<script>__BUNDLE__</script>
</body>
</html>
