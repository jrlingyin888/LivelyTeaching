<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>小象课堂 LivelyTeaching</title>
<style>
:root{
  --navy:#14263f; --ink:#16202e; --line:#dfe6ee;
  --acc:#2e6f9e; --acc-d:#1f5479; --ok:#1f7a5a; --warm:#e8912f; --red:#d8453d;
  --panel:rgba(255,255,255,.95);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe3f0;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}

/* ---------- 顶栏 ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;
  gap:10px;padding:14px 16px;pointer-events:none}
.ic{width:46px;height:46px;flex:none;border:none;border-radius:14px;cursor:pointer;
  background:var(--panel);backdrop-filter:blur(10px);font-size:21px;line-height:1;
  box-shadow:0 4px 18px rgba(20,38,63,.14);pointer-events:auto;transition:.15s;color:var(--navy)}
.ic:hover{background:#fff;transform:translateY(-1px)}
.ic.off{opacity:.45}
.brand{background:var(--panel);backdrop-filter:blur(10px);border-radius:14px;
  padding:9px 16px;box-shadow:0 4px 18px rgba(20,38,63,.13);pointer-events:auto;
  display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:18px;color:var(--navy);white-space:nowrap}
.brand span{font-size:12.5px;color:#7b8898;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{margin-left:auto}

/* ---------- 大字提示（配朗读）---------- */
#say{position:fixed;top:78px;left:12px;right:12px;margin:0 auto;width:fit-content;
  transform:translateY(-12px);z-index:6;
  max-width:min(760px,calc(100vw - 24px));text-align:center;background:var(--panel);backdrop-filter:blur(10px);
  border-radius:var(--r);padding:16px 30px;box-shadow:0 8px 30px rgba(20,38,63,.17);
  font-size:23px;font-weight:650;color:var(--navy);line-height:1.5;
  opacity:0;pointer-events:none;transition:.32s}
#say.show{opacity:1;transform:translateY(0)}

/* ---------- 数值面板（仅高年级场景）---------- */
.hud{width:100%;max-width:420px;background:var(--panel);
  backdrop-filter:blur(10px);border-radius:var(--r);padding:14px 18px;
  box-shadow:0 8px 30px rgba(20,38,63,.16)}
.hud h3{margin:0 0 12px;font-size:13px;letter-spacing:.08em;color:var(--acc);font-weight:650}
.row{display:flex;justify-content:space-between;align-items:baseline;
  padding:7px 0;border-top:1px solid #eef2f6;font-size:13.5px;color:#66727f}
.row:first-of-type{border-top:none}
.row .v{font-weight:700;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.row .v.ok{color:var(--ok)}
.track{height:9px;background:#e7edf3;border-radius:5px;overflow:hidden;margin:12px 0 4px}
#bar{height:100%;width:0;background:var(--acc);border-radius:5px;transition:width .35s ease}
#bar.done{background:var(--ok)}
.legend{display:flex;justify-content:space-between;font-size:11.5px;color:#98a4b2}

/* ---------- 图形化计数（代替数字，一年级会数数但不懂单位）---------- */
/* 底部 dock：步骤条和操作按钮排成一列，永远不会互相压住 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;
  align-items:center;gap:9px;padding:0 12px 18px;pointer-events:none}
.dock > *{pointer-events:auto;max-width:100%}

#tally{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px;
  pointer-events:none}   /* 只读展示，不能挡住 3D 上的点击 */
#tally:empty{display:none}
.trow{display:flex;align-items:center;gap:11px;background:var(--panel);backdrop-filter:blur(10px);
  border-radius:13px;padding:10px 15px;box-shadow:0 5px 20px rgba(20,38,63,.14)}
.tl{font-size:16px;font-weight:600;color:var(--navy);min-width:3.6em;flex:none}
/* 图标必须排成一行，窄屏上挤成竖排就没法一眼数出来了 */
.tc{font-size:19px;letter-spacing:2px;color:var(--warm);flex:1;white-space:nowrap;overflow:hidden}
.tn{font-size:21px;font-weight:800;color:var(--navy);margin-left:auto;min-width:1.3em;
  text-align:right;flex:none}

/* ---------- 步骤（小圆点，给陪读的大人定位用）---------- */
.steps{display:flex;gap:6px;background:var(--panel);backdrop-filter:blur(10px);
  padding:7px;border-radius:13px;box-shadow:0 6px 26px rgba(20,38,63,.14);overflow:auto}
.steps:empty{display:none}
.step{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9px;
  font-size:13px;color:#94a1b0;white-space:nowrap}
.step i{width:9px;height:9px;border-radius:50%;background:#dfe6ee;flex:none}
.step.active{background:var(--acc);color:#fff}
.step.active i{background:#fff}
.step.done{color:var(--ok)}
.step.done i{background:var(--ok)}

/* ---------- 操作按钮：大、少、只亮该点的 ---------- */
.bar{display:flex;gap:11px;flex-wrap:wrap;justify-content:center}
button.b{border:none;cursor:pointer;font:inherit;font-size:19px;font-weight:650;
  padding:16px 30px;border-radius:15px;background:var(--panel);color:var(--navy);
  backdrop-filter:blur(10px);box-shadow:0 5px 20px rgba(20,38,63,.15);transition:.15s}
button.b:hover{background:#fff;transform:translateY(-2px)}
button.b:active{transform:translateY(0)}
button.b.pri{background:var(--acc);color:#fff}
button.b.pri:hover{background:var(--acc-d)}
button.b.ghost{background:rgba(255,255,255,.72);color:#6d7987;font-weight:500;font-size:16px;padding:13px 22px}
button.b.dim{opacity:.42}

/* ---------- 猜一猜 ---------- */
#ask{position:fixed;inset:0;z-index:9;display:grid;place-items:center;
  background:rgba(12,24,40,.5);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:.3s}
#ask.show{opacity:1;pointer-events:auto}
#ask .card{background:#fff;border-radius:24px;padding:34px 38px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.3);max-width:min(620px,92vw);transform:scale(.94);transition:.3s}
#ask.show .card{transform:scale(1)}
.qt{display:inline-block;background:#fff3e2;color:var(--warm);font-size:14px;font-weight:700;
  letter-spacing:.1em;padding:6px 15px;border-radius:20px;margin-bottom:16px}
#ask h2{margin:0 0 26px;font-size:27px;color:var(--navy);line-height:1.45;font-weight:700}
.opts{display:flex;gap:13px;justify-content:center;flex-wrap:wrap}
.opt{border:2.5px solid #e3ebf3;background:#f7fafc;cursor:pointer;font:inherit;
  font-size:20px;font-weight:650;color:var(--navy);padding:18px 26px;border-radius:17px;
  min-width:118px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:.15s}
.opt:hover{border-color:var(--acc);background:#fff;transform:translateY(-3px)}
.oi{font-size:38px;line-height:1}

/* ---------- 揭晓：对了 / 再看看（不打叉）---------- */
#judge{position:fixed;top:50%;left:16px;right:16px;margin:0 auto;width:fit-content;
  transform:translateY(-40%);z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
  padding:24px 40px;border-radius:22px;opacity:0;pointer-events:none;transition:.35s;
  box-shadow:0 20px 60px rgba(0,0,0,.26);max-width:calc(100vw - 32px)}
#judge.show{opacity:1;transform:translateY(-50%)}
#judge b{font-size:32px;font-weight:800}
#judge span{font-size:17px;opacity:.92;line-height:1.5}
#judge.good{background:#e8f7f0;color:var(--ok)}
#judge.again{background:#fff4e4;color:#b86d12}

/* ---------- 结论 ---------- */
#result{position:fixed;inset:0;z-index:11;display:grid;place-items:center;
  background:rgba(12,24,40,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.35s}
#result.show{opacity:1;pointer-events:auto}
#result .card{background:#fff;border-radius:24px;padding:36px 42px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.3);max-width:min(560px,92vw);transform:scale(.94);transition:.35s}
#result.show .card{transform:scale(1)}
.ri{font-size:64px;line-height:1;margin-bottom:12px}
#result .t{font-size:13px;letter-spacing:.16em;color:var(--acc);font-weight:650;margin-bottom:10px}
#result h2{margin:0 0 6px;font-size:27px;color:var(--navy);line-height:1.45}
#result .big{font-size:52px;font-weight:800;color:var(--navy);margin:14px 0 2px}
#result .big em{font-size:22px;font-style:normal;color:#8996a5;font-weight:600;margin-left:6px}
#result p{color:#5b6874;font-size:17px;margin:14px 0 0;line-height:1.75}
#result p.grown{font-size:13.5px;color:#98a4b2;margin-top:16px;padding-top:14px;
  border-top:1px solid #eef2f6;line-height:1.7}
#result .eq{display:flex;align-items:center;justify-content:center;gap:14px;
  margin:22px 0 4px;padding:16px;background:#f4f8fb;border-radius:13px}
#result .eq div{font-size:13px;color:#8996a5}
#result .eq b{display:block;font-size:19px;color:var(--navy);margin-top:3px}
#result .eq span{font-size:22px;color:var(--acc);font-weight:700}
.rbtn{display:flex;gap:11px;justify-content:center;margin-top:26px;flex-wrap:wrap}

/* ---------- toast（给大人的次要提示）---------- */
#toast{position:fixed;bottom:178px;left:12px;right:12px;margin:0 auto;width:fit-content;
  transform:translateY(10px);z-index:7;
  background:rgba(20,38,63,.9);color:#fff;font-size:14px;padding:10px 20px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.3s}
#toast.show{opacity:1;transform:translateY(0)}

/* ---------- 首页：图卡片，孩子点，不打字 ---------- */
#home{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:auto;
  background:linear-gradient(155deg,#152a49,#1f3f68 55%,#2a5f8d);transition:opacity .42s}
#home.hide{opacity:0;pointer-events:none}
.hwrap{width:min(880px,92vw);color:#fff;text-align:center;padding:40px 0}
.hwrap .k{font-size:12.5px;letter-spacing:.24em;color:#8fb6d8;margin-bottom:14px}
.hwrap h1{font-size:36px;margin:0 0 10px;font-weight:700}
.hwrap .sub{color:#a9c7e2;font-size:16px;margin-bottom:38px}
#homeGrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.hcard{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18);
  border-radius:22px;padding:30px 20px;cursor:pointer;color:#fff;font:inherit;
  transition:.2s;display:flex;flex-direction:column;align-items:center;gap:11px}
.hcard:hover{background:rgba(255,255,255,.2);transform:translateY(-4px);border-color:rgba(255,255,255,.4)}
.hi{font-size:60px;line-height:1}
.hn{font-size:22px;font-weight:700}
.hs{font-size:13.5px;color:#a9c7e2}
.hnote{color:#7396b8;font-size:12.5px;margin-top:32px;line-height:1.7}

/* ---------- 桌面：数据条挪到左上角，把底部让给按钮 ---------- */
@media(min-width:861px){
  /* 大字提示是居中的，宽度会盖到左上角，所以 tally 压到它下面 */
  #tally{position:fixed;top:186px;left:16px;flex-direction:column;align-items:flex-start;
    max-width:300px}
  .hud{position:fixed;top:78px;right:16px;width:268px;z-index:5}
}

/* ---------- 手机 / 平板 ---------- */
@media(max-width:860px){
  #say{font-size:20px;padding:13px 20px;top:74px}
  .trow{flex:1;min-width:140px}
  .bar{gap:9px}
  button.b{font-size:17px;padding:14px 22px}
  button.b.ghost{font-size:15px;padding:12px 17px}
  #ask h2{font-size:22px} .opt{font-size:18px;padding:15px 20px;min-width:96px}
  .oi{font-size:32px}
  #judge b{font-size:26px}
  .hwrap h1{font-size:27px} .hi{font-size:48px} .hn{font-size:19px}
}
@media(max-width:520px){
  .brand span{display:none}
  .trow{flex-basis:100%}          /* 一行一条，图标才排得开 */
  /* 步骤条放不下四个词，只留圆点，当前那一步才显示文字 */
  .step{padding:6px 7px;font-size:0;gap:0}
  .step.active{padding:6px 12px;font-size:13px;gap:6px}
  .opts{flex-direction:column} .opt{width:100%;flex-direction:row;justify-content:center}
  #homeGrid{grid-template-columns:1fr}
}
</style></head>
<body>

<div id="stage"></div>

<div class="top">
  <button id="btnHome" class="ic" title="换一个">&#8592;</button>
  <div class="brand"><b id="bTitle">小象课堂</b><span id="bSub">LivelyTeaching</span></div>
  <button id="btnVoice" class="ic sp" title="朗读">&#128266;</button>
</div>

<div id="say"></div>

<div class="dock">
  <div class="hud" id="hud" style="display:none">
    <h3>实验数据</h3>
    <div id="stats"></div>
    <div class="track"><div id="bar"></div></div>
    <div class="legend"><span>空船</span><span id="legendR" class="v">&#8212;</span></div>
  </div>
  <div id="tally"></div>
  <div class="steps" id="steps"></div>
  <div class="bar" id="actions"></div>
</div>

<div id="toast"></div>
<div id="judge"></div>
<div id="ask"><div class="card"></div></div>
<div id="result"><div class="card"></div></div>

<div id="home"><div class="hwrap">
  <div class="k">小象课堂 · LivelyTeaching</div>
  <h1>今天想玩哪一个？</h1>
  <div class="sub">点一个图，就可以开始动手做实验了</div>
  <div id="homeGrid"></div>
  <div class="hnote">用手指拖动可以转动画面 · 右上角小喇叭可以关掉朗读</div>
</div></div>

<script>

'<div class="sub">请用最新版 Chrome / Edge / Safari 打开，并在设置里开启「使用硬件加速」。</div></div>';}}catch(e){}})();
</script>
